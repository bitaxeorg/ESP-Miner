name: Unit Test
on: [push, pull_request]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build-and-test
            ubsan: 'OFF'
            artifact: test-results
          - name: build-and-test-ubsan
            ubsan: 'ON'
            artifact: test-results-ubsan
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Check QEMU runner
        if: matrix.ubsan == 'OFF'
        run: python3 -m unittest discover -s tools/tests -p 'test_qemu_runner.py'

      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          command: GITHUB_ACTIONS="true" idf.py -D ENABLE_UBSAN=${{ matrix.ubsan }} build
          path: 'test-ci'

      - name: Run tests
        uses: bitaxeorg/esp32-qemu-test-action@v6
        with:
          path: 'test-ci'

      - name: Upload event file
        if: always() && matrix.ubsan == 'OFF'
        uses: actions/upload-artifact@v4
        with:
          name: event-file
          path: ${{ github.event_path }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            report.xml
            test-ci/build/output.log
            test-ci/build/unit_test_stratum.elf

      - name: Check for test failures
        if: always()
        run: |
          if grep -q 'Undefined behavior of type ' test-ci/build/output.log; then
            echo "::error ::UBSan detected undefined behavior."
            exit 1
          fi
          if [ ! -s report.xml ]; then
            echo "::error ::QEMU did not produce a test report."
            exit 1
          fi
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          report = ET.parse("report.xml").getroot()
          if any(int(node.get(attr, "0")) for node in report.iter()
                 for attr in ("failures", "errors")):
              raise SystemExit("Detected QEMU test failures or errors.")
          PY

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.14.0'

      - name: Run frontend tests
        working-directory: ./main/http_server/axe-os
        run: |
          npm ci
          npm run test:ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: main/http_server/axe-os/report.xml
