@if (tooltip) {
  @if (!isMobile) {
    <i appTooltip="{{tooltip}}" [ngClass]="tooltipIconClass"></i>
  }
  @if (isMobile) {
    <button (click)="showMobileTooltip = true" [ngClass]="tooltipIconClass"></button>
  }
  @if (showMobileTooltip) {
    <div (click)="showMobileTooltip = false" class="tooltip-mobile-backdrop">
      <div class="tooltip-mobile-content">
        <button class="tooltip-mobile-close" (click)="showMobileTooltip = false">&times;</button>
        <p>{{ tooltip }}</p>
      </div>
    </div>
  }
}
