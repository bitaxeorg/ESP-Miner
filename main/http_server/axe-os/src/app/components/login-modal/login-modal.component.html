<app-modal [headline]="'Authentication Required - ' + host" [closable]="false" [isVisible]="isVisible">
  <div class="flex flex-col gap-3 pt-2">
    @if (error) {
      <div class="text-red-500 mb-2 font-medium">
        {{ error }}
      </div>
    }
    <div class="flex flex-col gap-1">
      <label for="loginPassword" class="font-medium">Password</label>
      <input
        #passwordInput
        id="loginPassword"
        type="password"
        class="input-text w-full"
        placeholder="Enter AxeOS password"
        [(ngModel)]="password"
        (keydown.enter)="onSubmit()" />
    </div>
    <div class="flex justify-end gap-2 mt-3">
      <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
      <button type="button" class="btn" (click)="onSubmit()" [disabled]="!password">Login</button>
    </div>
  </div>
</app-modal>
