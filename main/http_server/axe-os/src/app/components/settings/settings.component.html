<div [ngClass]="{'hidden': !(form$ | async)}">
    <div class="card mb-4">
        <h2>{{ 'settings.title' | t }}</h2>
        <h3 class="mt-4 mb-3">{{ 'settings.ui.title' | t }}</h3>
        <div class="flex flex-col md:flex-row md:items-center gap-2">
            <label for="uiLanguage" class="w-full md:w-2/12 font-medium cursor-pointer">{{ 'settings.ui.language' | t }}</label>
            <div class="w-full md:w-10/12">
                <app-dropdown
                    [options]="languageOptions"
                    [ngModel]="selectedLocale"
                    (ngModelChange)="onLanguageChange($event)"
                    inputId="uiLanguage"
                ></app-dropdown>
            </div>
        </div>
    </div>
    <app-edit (saveRequested)="applyLocaleOnSave()"></app-edit>
</div>
